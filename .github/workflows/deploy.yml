name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          script: |
            echo "=========================================="
            echo "  VELVET FRONTEND DEPLOYMENT"
            echo "  $(date)"
            echo "=========================================="

            # ---- STEP 1: Pull latest code ----
            echo ""
            echo "[1/6] Pulling latest code..."
            cd /home/velvetweb/velvet-repo
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # ---- STEP 2: Clean stale legacy files from the web root ----
            # The old PHP site left an index.php that redirects "/" to
            # "/en/index.php", intercepting the Next.js app. Back it up
            # (never delete) so the root URL keeps serving the new site.
            echo ""
            echo "[2/6] Cleaning stale legacy files from web root..."
            for ROOT in /home/velvetweb/public_html /home/velvetweb/velvet-repo/public; do
              if [ -d "$ROOT" ]; then
                echo "Scanning $ROOT"
                if [ -f "$ROOT/index.php" ] && [ ! -L "$ROOT/index.php" ]; then
                  mv -f "$ROOT/index.php" "$ROOT/index.php.bak-$(date +%Y%m%d%H%M%S)"
                  echo "Backed up $ROOT/index.php"
                else
                  echo "No index.php found (or it is a symlink)"
                fi
              fi
            done

            # ---- STEP 3: Install dependencies ----
            echo ""
            echo "[3/6] Installing dependencies..."
            npm install

            # ---- STEP 4: Build ----
            echo ""
            echo "[4/6] Building..."
            npm run build

            # ---- STEP 5: Restart via PM2 ----
            echo ""
            echo "[5/6] Restarting application..."
            cd /home/velvetweb/velvet-repo
            pm2 delete velvet-frontend 2>/dev/null || true
            pm2 start npm --name velvet-frontend -- start

            # ---- STEP 6: Save and verify ----
            echo ""
            echo "[6/6] Saving PM2 config..."
            pm2 save
            sleep 2
            pm2 status

            echo ""
            echo "=========================================="
            echo "  DONE - $(date)"
            echo "=========================================="
