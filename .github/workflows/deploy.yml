name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          script: |
            echo "=========================================="
            echo "  VELVET FRONTEND DEPLOYMENT"
            echo "  $(date)"
            echo "=========================================="

            # ---- STEP 1: Pull latest code ----
            echo ""
            echo "[1/6] Pulling latest code..."
            cd /home/velvetweb/velvet-repo
            git fetch origin
            git reset --hard origin/main
            git clean -fd


            # ---- STEP 2: Remove old PHP entry points (skip if not present) ----
            echo ""
            echo "[2/6] Removing old PHP index files if they exist..."
            #rm -f /home/velvetweb/public_html/index.php
            #rm -f /home/velvetweb/velvet-repo/public/index.php
            echo "Done."


            # ---- STEP 3: Install dependencies ----
            echo ""
            echo "[3/6] Installing dependencies..."
            npm install

            # ---- STEP 4: Build ----
            echo ""
            echo "[4/6] Building..."
            npm run build

            # ---- STEP 5: Restart via PM2 ----
            echo ""
            echo "[5/6] Restarting application..."
            cd /home/velvetweb/velvet-repo
            pm2 delete velvet-frontend 2>/dev/null || true
            pm2 start npm --name velvet-frontend -- start

            # ---- STEP 6: Save and verify ----
            echo ""
            echo "[6/6] Saving PM2 config..."
            pm2 save
            sleep 2
            pm2 status

            echo ""
            echo "=========================================="
            echo "  DONE - $(date)"
            echo "=========================================="
