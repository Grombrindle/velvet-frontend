name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          script: |
            echo "=========================================="
            echo "  VELVET FRONTEND DEPLOYMENT"
            echo "  $(date)"
            echo "=========================================="

            # ---- STEP 1: Pull latest code ----
            echo ""
            echo "[1/5] Pulling latest code..."
            cd /home/velvetweb/velvet-repo
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # ---- STEP 2: Install dependencies ----
            echo ""
            echo "[2/5] Installing dependencies..."
            npm install

            # ---- STEP 3: Build ----
            echo ""
            echo "[3/5] Building..."
            npm run build

            # ---- STEP 4: Restart via PM2 ----
            echo ""
            echo "[4/5] Restarting application..."
            cd /home/velvetweb/velvet-repo
            pm2 delete velvet-frontend 2>/dev/null || true
            pm2 start npm --name velvet-frontend -- start

            # ---- STEP 5: Save and verify ----
            echo ""
            echo "[5/5] Saving PM2 config..."
            pm2 save
            sleep 2
            pm2 status

            echo ""
            echo "=========================================="
            echo "  DONE - $(date)"
            echo "=========================================="
